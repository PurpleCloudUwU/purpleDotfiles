# Keep Bluetooth headphones in A2DP (good sound) when an app opens a microphone.
# Calls then use the default microphone (laptop) instead of the headset mic,
# which would force the low-quality headset profile (HFP).
# The headset profile can still be chosen manually: Bluetooth menu ->
# device -> "Codec / Profil wählen".
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
