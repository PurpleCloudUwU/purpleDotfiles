# yazi, the terminal file manager (`y` in bash).
# Its colours (theme.toml next to this file) are the old station Violet.

[mgr]
ratio          = [1, 2, 3]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = false
linemode       = "size"
scrolloff      = 3

[preview]
max_width  = 900
max_height = 900
