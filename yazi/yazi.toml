# yazi, the file manager in the right column (Super+E).
# Its colours (theme.toml next to this file) come from `station theme`.

[mgr]
ratio          = [1, 2, 3]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = false
linemode       = "size"
scrolloff      = 3

[preview]
max_width  = 900
max_height = 900
