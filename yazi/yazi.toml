# Yazi settings (only changes to the defaults).
# Defaults: https://yazi-rs.github.io/docs/configuration/yazi

[opener]
# Like the default, but falls back to nvim instead of vi (not installed)
# when $EDITOR is unset
edit = [
	{ run = "${EDITOR:-nvim} %s", desc = "$EDITOR", for = "unix", block = true },
]
