# foot, the terminal on the canvas. Colours come from `station theme`
# (~/.local/state/station/foot-colors.ini); this file is only the rest.

# Departure Mono is drawn on an 11 px grid, so 22 px keeps it sharp.
# VT323 steps in when the Nerd Font is missing.
font=DepartureMono Nerd Font Mono:pixelsize=22, VT323:pixelsize=26
pad=24x20
term=foot
include=~/.local/state/station/foot-colors.ini

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000

[bell]
urgent=yes

[key-bindings]
# Ctrl+Shift+N opens another foot in the same folder
spawn-terminal=Control+Shift+n
