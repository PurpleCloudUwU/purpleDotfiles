# foot, kept as a second terminal (kitty is the main one now). The
# colours are the old station Violet, written in here.

# Departure Mono is drawn on an 11 px grid, so 22 px keeps it sharp.
# VT323 steps in when the Nerd Font is missing.
font=DepartureMono Nerd Font Mono:pixelsize=22, VT323:pixelsize=26
pad=24x20
term=foot

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000

[bell]
urgent=yes

[key-bindings]
# Ctrl+Shift+N opens another foot in the same folder
spawn-terminal=Control+Shift+n

[colors-dark]
background=12131d
foreground=d9d6f2
regular0=0c0d14
regular1=ff6b8b
regular2=8fd6a8
regular3=e8c87a
regular4=5b8cff
regular5=9b7bff
regular6=6fd0e0
regular7=a9a6c8
bright0=3a3d5c
bright1=ff93aa
bright2=b4e8c6
bright3=f2dca2
bright4=a9c4ff
bright5=c9bfff
bright6=a0e4ee
bright7=d9d6f2
selection-foreground=0c0d14
selection-background=c9bfff
cursor=12131d c9bfff
urls=9b7bff
