# kitty: colors and look matching Sway, Waybar, fuzzel and mako
include blackhole.conf

# Font (same as Waybar, fuzzel and mako)
font_family JetBrainsMono Nerd Font
font_size 15

# Links
url_style curly
detect_urls yes
underline_hyperlinks hover

sync_to_monitor yes

# Transparency (ctrl+shift+a then m/l changes it at runtime)
background_opacity 0.7
dynamic_background_opacity yes

# Square corners, thin purple borders and some inner spacing
window_border_radius 0
window_border_width 1pt
draw_minimal_borders yes
window_padding_width 6 10

# Title bars only for split tabs (a single window already has the Sway title)
window_title_bar top
window_title_bar_min_windows 2

# Tabs as flat blocks, like the Waybar workspaces
tab_bar_style separator
tab_separator ""
tab_title_template " {index}: {title} "
active_tab_font_style normal

# No beeping
enable_audio_bell no
