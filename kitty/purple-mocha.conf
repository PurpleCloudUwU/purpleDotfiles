# Purple Mocha for kitty: Catppuccin Mocha with the purple accent #b794f6,
# same palette as Sway, Waybar, fuzzel and mako.

# Basic colors
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #b794f6
cursor                  #b794f6
cursor_text_color       #1e1e2e
url_color               #b794f6

# Borders between windows (splits), like the Sway window borders
active_border_color     #b794f6
inactive_border_color   #45475a
bell_border_color       #f9e2af

# Window title bars
window_title_bar_active_background   #b794f6
window_title_bar_active_foreground   #1e1e2e
window_title_bar_inactive_background #181825
window_title_bar_inactive_foreground #a6adc8

# Tabs, like the Waybar workspaces: active tab purple with dark text
tab_bar_background      #11111b
active_tab_background   #b794f6
active_tab_foreground   #1e1e2e
inactive_tab_background #181825
inactive_tab_foreground #a6adc8

# Marks (kitty's highlight feature)
mark1_background #b794f6
mark1_foreground #1e1e2e
mark2_background #cba6f7
mark2_foreground #1e1e2e
mark3_background #89b4fa
mark3_foreground #1e1e2e

# The 16 terminal colors (Catppuccin Mocha, magenta = accent purple)
# black
color0  #45475a
color8  #585b70
# red
color1  #f38ba8
color9  #f38ba8
# green
color2  #a6e3a1
color10 #a6e3a1
# yellow
color3  #f9e2af
color11 #f9e2af
# blue
color4  #89b4fa
color12 #89b4fa
# magenta
color5  #b794f6
color13 #cba6f7
# cyan
color6  #94e2d5
color14 #94e2d5
# white
color7  #bac2de
color15 #a6adc8
