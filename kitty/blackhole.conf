# blackhole for kitty: Catppuccin Mocha with the purple accent #be8cff,
# same palette as Sway, Waybar, fuzzel and mako.

# Basic colors
foreground              #f0d7ff
background              #0f0b14
selection_foreground    #0f0b14
selection_background    #be8cff
cursor                  #be8cff
cursor_text_color       #0f0b14
url_color               #be8cff

# Borders between windows (splits), like the Sway window borders
active_border_color     #be8cff
inactive_border_color   #332645
bell_border_color       #f9e2af

# Window title bars
window_title_bar_active_background   #be8cff
window_title_bar_active_foreground   #0f0b14
window_title_bar_inactive_background #0b080f
window_title_bar_inactive_foreground #a396d0

# Tabs, like the Waybar workspaces: active tab purple with dark text
tab_bar_background      #08060a
active_tab_background   #be8cff
active_tab_foreground   #0f0b14
inactive_tab_background #0b080f
inactive_tab_foreground #a396d0

# Marks (kitty's highlight feature)
mark1_background #be8cff
mark1_foreground #0f0b14
mark2_background #c8b9ff
mark2_foreground #0f0b14
mark3_background #89b4fa
mark3_foreground #0f0b14

# The 16 terminal colors (Catppuccin Mocha, magenta = accent purple)
# black
color0  #332645
color8  #44325c
# red
color1  #f38ba8
color9  #f38ba8
# green
color2  #a6e3a1
color10 #a6e3a1
# yellow
color3  #f9e2af
color11 #f9e2af
# blue
color4  #89b4fa
color12 #89b4fa
# magenta
color5  #be8cff
color13 #c8b9ff
# cyan
color6  #94e2d5
color14 #94e2d5
# white
color7  #ceb8dc
color15 #a396d0
