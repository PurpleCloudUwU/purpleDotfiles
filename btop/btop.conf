# btop. install.sh copies this file instead of linking it, because btop
# writes its whole config back on exit. The theme comes from `station theme`.
color_theme = "station"
theme_background = false
truecolor = true
rounded_corners = false
vim_keys = true
update_ms = 2000
graph_symbol = "block"
shown_boxes = "cpu mem net proc"
proc_sorting = "cpu lazy"
