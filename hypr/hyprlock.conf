# hyprlock: a station terminal in the current theme. Centered, so it fits
# any resolution. The colours come from `station theme`.
# (valign = center: positive y is up)

source = ~/.local/state/station/hyprlock-colors.conf

# Pocket if installed, otherwise VT323 (Pango takes the first one it finds)
$font = Pocket, VT323
$label = Silkscreen

general {
    hide_cursor = true
    ignore_empty_input = true
}

# The finger on the sensor unlocks too (fprintd, see fingerprint/setup.sh)
auth {
    fingerprint {
        enabled = true
        ready_message = PLACE FINGER ON SENSOR
        present_message = SCANNING ...
    }
}

background {
    monitor =
    color = $bg
}

# Window with a header strip, like the program select
shape {
    monitor =
    size = 760, 560
    color = $surface
    border_size = 3
    border_color = $frame
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 754, 42
    color = $frame
    rounding = 0
    position = 0, 256
    halign = center
    valign = center
}

label {
    monitor =
    text = STATION: LOCKED
    color = $bg
    font_size = 28
    font_family = $font
    position = -230, 256
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] uname -n | tr a-z A-Z
    color = $bg
    font_size = 28
    font_family = $font
    position = 280, 256
    halign = center
    valign = center
}

# Clock and date
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $fg
    font_size = 150
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_ALL=C date +'%a %d %b %Y' | tr a-z A-Z
    color = $muted
    font_size = 30
    font_family = $font
    position = 0, -5
    halign = center
    valign = center
}

# Password, or the finger
label {
    monitor =
    text = USER: $USER
    color = $muted
    font_size = 11
    font_family = $label
    position = 0, -72
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 520, 56
    outline_thickness = 2
    rounding = 0
    outer_color = $frame
    inner_color = $bg
    font_color = $fg
    font_family = $font
    check_color = $frame
    fail_color = $accent
    capslock_color = $accent
    fade_on_empty = false
    placeholder_text = PASSWORD OR FINGER
    fail_text = ACCESS DENIED ($ATTEMPTS)
    dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.3
    dots_center = true
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = $accent
    font_size = 24
    font_family = $font
    position = 0, -180
    halign = center
    valign = center
}

# Battery at the bottom edge of the window
label {
    monitor =
    text = cmd[update:30000] echo "BAT $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo --) %"
    color = $muted
    font_size = 22
    font_family = $font
    position = 0, -248
    halign = center
    valign = center
}
