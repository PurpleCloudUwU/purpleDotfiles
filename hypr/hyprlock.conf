# ~/.config/hypr/hyprlock.conf
# Layout for 1920x1080. All positions are in pixels.
# For another resolution, adjust $colx/$textx and the y values.
# (valign = center: positive y = up, negative y = down)

# --- Colors (purple/violet) ---
$bgcolor = rgba(0f0b14ff)
$fg      = rgba(f0d7ffff)
$accent  = rgba(be8cffff)
$dim     = rgba(6c628aff)

# --- Fonts: put a pixel font here for the pixel look ---
$mono  = JetBrainsMono Nerd Font
$pixel = JetBrainsMono Nerd Font

# --- Columns (x from the left edge) ---
$colx  = 1070
$textx = 1220

# --- Monitor for clock, text and password field ---
# The layout only fits 1920x1080. Other monitors only show the background.
# Leave empty ($mon =) to show it on all monitors.
$mon = eDP-1

# --- Helper script for date, moon, status ---
$info = ~/.config/hypr/lock-info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/bg_blur.png
    blur_passes = 0
    color = $bgcolor
}

# Divider line in the middle
shape {
    monitor = $mon
    size = 2, 1040
    color = $dim
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# --- Host sigil + caption ---
image {
    monitor = $mon
    path = ~/.config/hypr/sigil.png
    size = 120
    rounding = 0
    border_size = 4
    border_color = $accent
    position = $colx, 373
    halign = left
    valign = center
}

label {
    monitor = $mon
    text = cmd[update:60000] uname -n
    color = $dim
    font_size = 17
    font_family = $mono
    position = $textx, 400
    halign = left
    valign = center
}

label {
    monitor = $mon
    text = host sigil, from
    color = $dim
    font_size = 17
    font_family = $mono
    position = $textx, 373
    halign = left
    valign = center
}

label {
    monitor = $mon
    text = cmd[update:60000] $info sigil
    color = $dim
    font_size = 17
    font_family = $mono
    position = $textx, 346
    halign = left
    valign = center
}

# --- Clock ---
label {
    monitor = $mon
    text = cmd[update:1000] date +%-H:%M
    color = $fg
    font_size = 128
    font_family = $pixel
    position = $colx, 124
    halign = left
    valign = center
}

# --- Date, planetary day/hour, moon ---
label {
    monitor = $mon
    text = cmd[update:60000] $info date
    color = $fg
    font_size = 20
    font_family = $mono
    position = $colx, 15
    halign = left
    valign = center
}

label {
    monitor = $mon
    text = cmd[update:60000] $info sky
    color = $accent
    font_size = 20
    font_family = $mono
    position = $colx, -12
    halign = left
    valign = center
}

label {
    monitor = $mon
    text = cmd[update:3600000] $info moon
    color = $dim
    font_size = 20
    font_family = $mono
    position = $colx, -38
    halign = left
    valign = center
}

# --- Password prompt ---
label {
    monitor = $mon
    text = @$USER
    color = $fg
    font_size = 20
    font_family = $mono
    position = $colx, -339
    halign = left
    valign = center
}

input-field {
    monitor = $mon
    size = 470, 52
    outline_thickness = 2
    rounding = 0
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = false
    dots_text_format = *
    outer_color = $accent
    inner_color = $bgcolor
    font_color = $fg
    font_family = $mono
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    check_color = $accent
    fail_color = rgba(f38ba8ff)
    fail_text = the word is wrong ($ATTEMPTS)
    capslock_color = rgba(f9e2afff)
    position = $colx, -388
    halign = left
    valign = center
}

# --- Status line: Hp = battery (both), T = seconds since boot ---
label {
    monitor = $mon
    text = cmd[update:5000] $info status
    color = $dim
    font_size = 18
    font_family = $mono
    position = $colx, -438
    halign = left
    valign = center
}

# Finger on the sensor unlocks too (fprintd, see fingerprint/setup.sh)
auth {
    fingerprint:enabled = true
}
