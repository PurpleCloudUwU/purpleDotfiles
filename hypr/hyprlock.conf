# ~/.config/hypr/hyprlock.conf
# Layout fuer 1920x1080. Alle Positionen sind Pixel.
# Bei anderer Aufloesung $colx/$textx und die y-Werte anpassen.
# (valign = center: positives y = nach oben, negatives y = nach unten)

# --- Farben (lila/violett) ---
$bgcolor = rgba(12101aff)
$fg      = rgba(e6dcf7ff)
$accent  = rgba(b794f6ff)
$dim     = rgba(7a6f94ff)

# --- Schriften: fuer den Pixel-Look hier eine Pixelschrift eintragen ---
$mono  = JetBrainsMono Nerd Font
$pixel = JetBrainsMono Nerd Font

# --- Spalten (x vom linken Rand) ---
$colx  = 1070
$textx = 1220

# --- Hilfsskript fuer Datum, Mond, Status ---
$info = /home/purple/.config/hypr/lock-info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/purple/.config/hypr/bg_blur.png
    blur_passes = 0
    color = $bgcolor
}

# Trennlinie in der Mitte
shape {
    monitor =
    size = 2, 1040
    color = $dim
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# --- Host-Siegel + Beschriftung ---
image {
    monitor =
    path = /home/purple/.config/hypr/sigil.png
    size = 120
    rounding = 0
    border_size = 4
    border_color = $accent
    position = $colx, 373
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] uname -n
    color = $dim
    font_size = 17
    font_family = $mono
    position = $textx, 400
    halign = left
    valign = center
}

label {
    monitor =
    text = host sigil, from
    color = $dim
    font_size = 17
    font_family = $mono
    position = $textx, 373
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] $info sigil
    color = $dim
    font_size = 17
    font_family = $mono
    position = $textx, 346
    halign = left
    valign = center
}

# --- Uhr ---
label {
    monitor =
    text = cmd[update:1000] date +%-H:%M
    color = $fg
    font_size = 128
    font_family = $pixel
    position = $colx, 124
    halign = left
    valign = center
}

# --- Datum, Planetentag/-stunde, Mond ---
label {
    monitor =
    text = cmd[update:60000] $info date
    color = $fg
    font_size = 20
    font_family = $mono
    position = $colx, 15
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] $info sky
    color = $accent
    font_size = 20
    font_family = $mono
    position = $colx, -12
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] $info moon
    color = $dim
    font_size = 20
    font_family = $mono
    position = $colx, -38
    halign = left
    valign = center
}

# --- Passwortabfrage ---
label {
    monitor =
    text = @$USER
    color = $fg
    font_size = 20
    font_family = $mono
    position = $colx, -339
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 470, 52
    outline_thickness = 2
    rounding = 0
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = false
    dots_text_format = *
    outer_color = $accent
    inner_color = $bgcolor
    font_color = $fg
    font_family = $mono
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    check_color = $accent
    fail_color = rgba(f38ba8ff)
    fail_text = the word is wrong ($ATTEMPTS)
    capslock_color = rgba(f9e2afff)
    position = $colx, -388
    halign = left
    valign = center
}

# --- Statuszeile: Hp = Akku (beide), T = Sekunden seit Boot ---
label {
    monitor =
    text = cmd[update:5000] $info status
    color = $dim
    font_size = 18
    font_family = $mono
    position = $colx, -438
    halign = left
    valign = center
}
