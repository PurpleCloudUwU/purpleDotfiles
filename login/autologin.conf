# purpleDotfiles: tty1 logs in on its own, ~/.bash_profile then starts niri
# and the yami lock screen asks for the password (niri/lock-at-login).
# install.sh puts this in /etc/systemd/system/getty@tty1.service.d/ with
# USER replaced by your user name.
# Silent: no issue text, no login prompt, and the screen is cleared (no
# --noclear), so nothing of the tty shows before niri. ~/.hushlogin hides
# the motd and "Last login".
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty -o '-p -f -- \\u' --skip-login --nonewline --noissue --nohostname --autologin USER %I ${TERM}
