# purpleDotfiles: tty1 logs in on its own, ~/.bash_profile then starts niri
# and the yami lock screen asks for the password (niri/lock-at-login).
# install.sh puts this in /etc/systemd/system/getty@tty1.service.d/ with
# USER replaced by your user name.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty -o '-p -f -- \\u' --noreset --noclear --autologin USER %I ${TERM}
