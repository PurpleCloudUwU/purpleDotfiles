# cava for the MUSIC widget (services/Cava.qml): 10 bars as text on stdout,
# one line per frame, values 0-100 separated by ";".
# 25 frames are plenty for 10 pixel bars and keep the CPU quiet.

[general]
bars = 10
framerate = 25
autosens = 1
sleep_timer = 2

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 77
