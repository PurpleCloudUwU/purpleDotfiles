<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- purpleDotfiles: Brave (Origin) without the pixel font.
     Brave takes its interface font from GTK (gtk-font-name, yami sets Tiny5),
     and with Tiny5 the tabs, menus and settings were hard to read. For the
     brave binary (/opt/brave-origin-bin/brave, fontconfig's prgname) Tiny5
     becomes Noto Sans; every other program keeps the pixel font. Web pages
     never ask for Tiny5, so they are unchanged. Linked to
     ~/.config/fontconfig/conf.d/ next to yami's 50-yami-pixel.conf. -->
<fontconfig>
  <match target="pattern">
    <test name="prgname"><string>brave</string></test>
    <test name="family"><string>Tiny5</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
  </match>
</fontconfig>
