# SwayOSD: small on-screen display for volume and brightness (keys in sway/osd.sh).
# Defaults: /etc/xdg/swayosd/config.toml

[server]
# style.css is picked up from ~/.config/swayosd/ automatically

# Bottom center (0.5 would be the screen center)
top_margin = 0.9

max_volume = 100
min_brightness = 5

# Only icon and bar, no number
show_percentage = false

duration = 1000

[client]
