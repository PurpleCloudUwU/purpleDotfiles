# yami: written by yami-shell (settings → services); edit it there or in yami-shell.json
# file dialogs and the screen-share picker come from yami (yami-files --portal, the picker
# itself is drawn by the shell); the rest as niri ships it
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=yami;gtk;
org.freedesktop.impl.portal.ScreenCast=yami;gnome;
