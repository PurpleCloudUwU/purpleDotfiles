[package]
name = "yami-files"
version = "2.4.3"
edition = "2021"
description = "Pixel-art file manager and portal file dialog for the yami shell"
license = "MIT"
publish = false

[[bin]]
name = "yami-files"
path = "src/main.rs"

[dependencies]
yami-px = { path = "../px" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop-wayland-source = "0.4"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
libc = "0.2"
blocking = "1"
