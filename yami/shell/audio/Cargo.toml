[package]
name = "yami-audio"
version = "2.5.0"
edition = "2021"
description = "Pixel-art audio device settings of the yami shell: Bluetooth codec and quality, bit depth and sample rate of USB/ALSA outputs (PipeWire + WirePlumber)"
license = "MIT"
publish = false

[[bin]]
name = "yami-audio"
path = "src/main.rs"

[dependencies]
yami-px = { path = "../px" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop-wayland-source = "0.4"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
