[package]
name = "yami-play"
version = "2.4.3"
edition = "2021"
description = "Pixel-art video and music player of the yami shell (libmpv, loaded at run time)"
license = "MIT"
publish = false

[[bin]]
name = "yami-play"
path = "src/main.rs"

[dependencies]
yami-px = { path = "../px" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
calloop-wayland-source = "0.4"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
