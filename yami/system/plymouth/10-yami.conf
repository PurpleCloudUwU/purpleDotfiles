# yami: plymouthd sometimes hangs on `plymouth quit` (NVIDIA, simpledrm handover). Then
# plymouth-quit-wait never ends, multi-user.target is never reached and services ordered after
# it (power-profiles-daemon and others) never start. Give up after a while and kill it.
[Service]
TimeoutStartSec=15s
ExecStopPost=-/usr/bin/pkill -KILL -x plymouthd
